services:
  wild-work:
    build: .
    container_name: wild-work
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - GOMEMLIMIT=2400MiB
      - GOGC=50
    mem_limit: 2800m
    ports:
      # 容器内监听 0.0.0.0:7863；宿主机仅绑定回环，公网请走反代（见 README）
      - "127.0.0.1:7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 单文件 bind 会让 config.json.tmp → rename 报 device or resource busy。
      # 仍挂这一份给启动读取；面板保存会改写 data/config.json 并尽力回写这里。
      - ./config.json:/app/config.json
